name: Manual Build

# fork: 以下内容为上游原样。其 docker 推送作业依赖 Docker Hub 的
# fork: DOCKER_USERNAME/DOCKER_PASSWORD secrets（本 fork 未配置，触发即红叉），
# fork: 故在本 fork 禁用触发；fork 等价的构建与镜像发布见 docker-ubus.yml。
on:
  push:
    branches: ["fork/disabled"]

permissions:
  contents: write
  packages: write

env:
  APP_DIR: .
  IMAGE_NAME: zhf883680/clash-traffic-monitor

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: go.sum

      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./...
          go vet ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: go.sum

      - name: Use preinstalled mingw toolchain
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\mingw64\bin\gcc.exe')) { throw 'preinstalled mingw64 toolchain not found' }
          Add-Content $env:GITHUB_PATH 'C:\mingw64\bin'
          gcc --version

      - name: Test
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test ./...

  build-binaries:
    needs: [test-linux, test-windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
            ext: ""
            ldflags: "-s -w"
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            ext: ""
            ldflags: "-s -w"
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            ext: ".exe"
            ldflags: "-s -w -H=windowsgui"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: go.sum

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Build binary
        working-directory: ${{ env.APP_DIR }}
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          OUTPUT_NAME=traffic-monitor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          echo "Building $OUTPUT_NAME"
          go build -ldflags="${{ matrix.ldflags }}" -o "./$OUTPUT_NAME" .
          chmod +x "./$OUTPUT_NAME" || true

      - name: Verify Windows GUI subsystem
        if: matrix.goos == 'windows'
        run: |
          x86_64-w64-mingw32-objdump -p ./traffic-monitor-windows-amd64.exe | grep -q "Subsystem.*Windows GUI" || {
            echo "windows binary is not a GUI subsystem binary"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: traffic-monitor-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: ${{ env.APP_DIR }}/traffic-monitor-*

  build-musl-arm64:
    needs: [test-linux, test-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build musl arm64 binary via Alpine container
        run: |
          docker run --rm \
            -v "$(pwd):/app" -w /app \
            --platform linux/arm64 \
            golang:1.21-alpine \
            sh -c "apk add --no-cache gcc musl-dev && \
                   CGO_ENABLED=1 go build -ldflags='-s -w' -o traffic-monitor-linux-arm64-musl ."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: traffic-monitor-linux-arm64-musl
          path: traffic-monitor-linux-arm64-musl

  build-macos:
    needs: [test-linux, test-windows]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: go.sum

      - name: Build macOS arm64 binary
        working-directory: ${{ env.APP_DIR }}
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: |
          OUTPUT_NAME=traffic-monitor-macos-arm64
          echo "Building $OUTPUT_NAME"
          go build -ldflags="-s -w" -o "./$OUTPUT_NAME" .
          chmod +x "./$OUTPUT_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: traffic-monitor-macos-arm64
          path: ${{ env.APP_DIR }}/traffic-monitor-macos-arm64

  build-docker:
    needs: [test-linux, test-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push_docker == 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
